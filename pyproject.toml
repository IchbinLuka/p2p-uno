[project]
name = "p2p-uno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luka Born", email = "luka.born.2003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ecdsa>=0.19.1",
    "fastapi>=0.123.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pytest>=9.0.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.38.0",
    "websockets>=16.0",
]

[project.scripts]
uno-mms = "p2p_uno.__main__:main"
uno-frontend = "p2p_uno.frontend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
